android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m

# 固定 debug 签名 keystore：新版 AGP 会优先用 $XDG_CONFIG_HOME/.android/debug.keystore（~/.config/.android/），
# 与旧构建机器的 ~/.android/debug.keystore 证书不一致 → 同包名覆盖安装报签名冲突。
# 按需自行取消注释并指向本机 keystore（默认签名：android/androiddebugkey/android）：
# android.injected.signingStoreFile=/home/YOU/.android/debug.keystore
android.injected.signingStoreType=PKCS12
android.injected.signingKeyAlias=androiddebugkey
android.injected.signingKeyPassword=android
android.injected.signingStorePassword=android
