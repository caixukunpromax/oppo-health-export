name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download and Prepare libxposed API
      run: |
        echo "=== 开始获取最新下载链接 ==="
        LATEST_URL=$(curl -s https://api.github.com/repos/libxposed/api/releases/latest | grep "browser_download_url" | grep ".aar" | cut -d '"' -f 4)
        echo "获取到的链接: $LATEST_URL"
        
        echo "=== 下载依赖文件 ==="
        wget -O api.aar "$LATEST_URL"
        
        echo "=== 解压并放入正确位置 ==="
        mkdir -p android/app/libs
        unzip -o api.aar classes.jar
        mv classes.jar android/app/libs/libxposed-api.jar
        
        echo "=== 检查文件是否就位 ==="
        ls -la android/app/libs/

    - name: Generate Gradle Wrapper
      working-directory: ./android
      run: gradle wrapper

    - name: Build with Gradle
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: oppo-health-export-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
